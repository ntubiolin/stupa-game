name: Story and adventure regression
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:i18n
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: story-build
          path: dist
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, mobile, recovery, art, debug, media, journey, pharping, mangyul, yarlung, samye, chimphu, finale, modes, adventure, japan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: story-build
          path: dist
      - run: google-chrome --version
      - run: npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite.log 2>&1 &
      - name: Run selected real-browser scenario
        run: |
          case "$STORY_SUITE" in
            pharping) node scripts/pharping-browser-test.mjs ;;
            mangyul|yarlung|samye|chimphu|finale) CHAPTER_SUITE="$STORY_SUITE" node scripts/chapter-browser-test.mjs ;;
            modes) node scripts/mode-switch-browser-test.mjs ;;
            debug) node scripts/story-debug-browser-test.mjs ;;
            media) node scripts/story-media-browser-test.mjs && node scripts/losang-still-browser-test.mjs && node scripts/chapter-stills-browser-test.mjs ;;
            adventure) node scripts/adventure-compat-test.mjs ;;
            japan) npm run test:japan ;;
            *) npm run test:browser ;;
          esac
        env:
          BROWSER_CHANNEL: chrome
          STORY_SUITE: ${{ matrix.suite }}
          STORY_BASE_URL: http://127.0.0.1:4173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-browser-evidence-${{ matrix.suite }}
          path: artifacts/
  validate:
    if: ${{ always() }}
    needs: [build, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require build and every browser suite
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
